<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Крепость 3D</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#000;color:#fff;font-family:'Segoe UI',sans-serif;overflow:hidden;width:100vw;height:100vh}
        .screen{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:100}
        .screen.hidden{display:none!important}
        #loginScreen{background:linear-gradient(135deg,#16213e,#0f3460)}
        #charSelect{background:linear-gradient(135deg,#16213e,#0f3460)}
        #lobbyScreen{background:linear-gradient(135deg,#16213e,#0f3460)}
        #loadingScreen{background:#000;flex-direction:column;gap:20px}
        #loadingScreen .spinner{width:40px;height:40px;border:4px solid #333;border-top-color:#e94560;border-radius:50%;animation:spin .8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        h1{font-size:48px;margin-bottom:10px;text-shadow:0 0 20px #e94560;color:#e94560}
        h2{margin-bottom:20px;color:#aaa;font-size:20px}
        input{padding:12px 24px;font-size:18px;border:2px solid #e94560;background:rgba(255,255,255,0.1);color:#fff;border-radius:8px;margin-bottom:15px;width:300px;text-align:center}
        button{padding:12px 32px;font-size:18px;border:none;background:#e94560;color:#fff;border-radius:8px;cursor:pointer;transition:all .3s;margin:5px}
        button:hover{background:#ff6b6b;transform:scale(1.05)}
        button:disabled{background:#555;cursor:not-allowed;transform:none}
        .role-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0;max-width:650px}
        .role-card{background:rgba(255,255,255,0.08);border:2px solid #555;border-radius:10px;padding:15px;cursor:pointer;transition:all .2s;text-align:center;min-width:170px}
        .role-card:hover{border-color:#e94560;background:rgba(233,69,96,0.15)}
        .role-card.selected{border-color:#e94560;background:rgba(233,69,96,0.25);box-shadow:0 0 15px rgba(233,69,96,0.3)}
        .role-card .icon{font-size:36px}
        .role-card .name{font-size:15px;font-weight:bold;margin:5px 0}
        .role-card .desc{font-size:11px;color:#aaa}
        .role-card .passive{font-size:10px;color:#9b59b6;margin-top:3px}
        .role-card .stats{font-size:10px;color:#888;margin-top:2px}
        .lobby-player{background:rgba(255,255,255,0.08);padding:10px 20px;border-radius:8px;margin:5px 0;display:flex;align-items:center;gap:10px}
        .lobby-player.ready{background:rgba(46,204,113,0.2);border:1px solid #2ecc71}
        #gameCanvas{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;cursor:crosshair}
        #hud{position:fixed;top:10px;left:10px;right:10px;display:none;justify-content:space-between;pointer-events:none;z-index:10}
        .hud-panel{background:rgba(0,0,0,0.75);padding:10px 15px;border-radius:8px;font-size:13px;line-height:1.5}
        .hp-bar{width:120px;height:6px;background:#333;border-radius:3px;margin-top:2px}
        .hp-fill{height:100%;border-radius:3px;transition:width .3s}
        #playerList{position:fixed;right:10px;top:50px;background:rgba(0,0,0,0.75);padding:10px;border-radius:8px;font-size:12px;display:none;z-index:10;min-width:160px}
        .plist-item{margin:3px 0;padding:4px 8px;border-radius:4px;border-left:3px solid #fff}
        #buildToolbar{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:none;gap:6px;z-index:10;flex-wrap:wrap;justify-content:center;max-width:90vw}
        .build-btn{padding:6px 12px;background:rgba(0,0,0,0.8);border:2px solid #555;color:#fff;border-radius:6px;cursor:pointer;font-size:12px;white-space:nowrap;transition:all .15s}
        .build-btn:hover,.build-btn.active{border-color:#e94560;background:rgba(233,69,96,0.3)}
        .build-btn.green{border-color:#2ecc71;background:rgba(46,204,113,0.3)}
        .build-btn.green:hover{background:rgba(46,204,113,0.5)}
        #abilityBar{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:none;gap:8px;z-index:10}
        .ability-btn{width:50px;height:50px;background:rgba(0,0,0,0.8);border:2px solid #555;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:10px;position:relative;transition:all .15s}
        .ability-btn:hover{border-color:#e94560}
        .ability-btn.on-cd{opacity:.5}
        .ability-btn .a-icon{font-size:20px}
        .ability-btn .a-key{position:absolute;top:2px;left:4px;font-size:9px;color:#aaa}
        .ability-btn .a-cd{position:absolute;bottom:2px;font-size:9px;color:#e74c3c}
        #chatPanel{position:fixed;bottom:70px;left:10px;width:300px;z-index:10;display:none}
        #chatMessages{background:rgba(0,0,0,0.5);border-radius:8px 8px 0 0;padding:8px;max-height:150px;overflow-y:auto;font-size:12px}
        .chat-msg{margin:2px 0;word-wrap:break-word}
        #chatInput{width:100%;padding:6px 10px;font-size:12px;border:1px solid #555;background:rgba(0,0,0,0.8);color:#fff;border-radius:0 0 8px 8px;outline:none}
        #minimap{position:fixed;bottom:70px;right:10px;border:2px solid #555;border-radius:5px;display:none;z-index:10}
        #message{position:fixed;top:35%;left:50%;transform:translate(-50%,-50%);font-size:36px;text-shadow:0 0 20px #e94560;display:none;pointer-events:none;z-index:20;text-align:center}
        #endScreen{background:rgba(0,0,0,0.92);z-index:200}
        #endScreen h1{font-size:56px;margin-bottom:10px}
        .results-table{margin:15px 0;border-collapse:collapse;min-width:400px}
        .results-table th,.results-table td{padding:8px 16px;border-bottom:1px solid #333;text-align:left;font-size:14px}
        .results-table th{color:#aaa;font-size:12px}
        #controlsInfo{position:fixed;bottom:10px;left:10px;font-size:11px;color:#555;display:none;z-index:10}
        #buildTimer{position:fixed;top:50px;left:50%;transform:translateX(-50%);font-size:28px;color:#f1c40f;display:none;z-index:10;text-shadow:0 0 10px rgba(241,196,15,0.5)}
        #bossWarning{position:fixed;top:30%;left:50%;transform:translate(-50%,-50%);font-size:42px;color:#e74c3c;display:none;z-index:25;text-shadow:0 0 30px #e74c3c;text-align:center}
        #crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:5;display:none}
        #crosshair::before,#crosshair::after{content:'';position:absolute;background:rgba(255,255,255,0.6)}
        #crosshair::before{width:2px;height:14px;left:50%;top:50%;transform:translate(-50%,-50%)}
        #crosshair::after{width:14px;height:2px;left:50%;top:50%;transform:translate(-50%,-50%)}
        ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#555;border-radius:2px}
    </style>
</head>
<body>
    <div id="loadingScreen" class="screen">
        <div class="spinner"></div>
        <div id="loadingText">Загрузка...</div>
    </div>
    <div id="loginScreen" class="screen hidden">
        <h1>Крепость 3D</h1>
        <h2>Кооп игра на 6 человек</h2>
        <input type="text" id="nameInput" placeholder="Твоё имя" maxlength="15">
        <input type="text" id="roomInput" placeholder="Код комнаты" value="default">
        <button id="nextBtn">Далее</button>
    </div>
    <div id="charSelect" class="screen hidden">
        <h2>Выбери класс</h2>
        <div class="role-grid" id="roleGrid"></div>
        <button id="joinBtn">Войти</button>
    </div>
    <div id="lobbyScreen" class="screen hidden">
        <h2>Лобби</h2>
        <div id="lobbyPlayers"></div>
        <p id="lobbyInfo" style="margin:10px;color:#aaa">Ждём...</p>
        <button id="readyBtn">Готов</button>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div id="crosshair"></div>
    <div id="hud"><div class="hud-panel" id="leftHud"></div><div class="hud-panel" id="rightHud"></div></div>
    <div id="playerList"></div>
    <div id="buildToolbar"></div>
    <div id="abilityBar"></div>
    <div id="chatPanel"><div id="chatMessages"></div><input type="text" id="chatInput" placeholder="Написать..." maxlength="200"></div>
    <div id="buildTimer"></div>
    <div id="message"></div>
    <div id="bossWarning"></div>
    <canvas id="minimap" width="150" height="112"></canvas>
    <div id="controlsInfo">WASD - движение | ЛКМ - стрелять/ставить | 1-4 - способности | T - чат | Колёсико - зум</div>
    <div id="endScreen" class="screen hidden">
        <h1 id="endTitle"></h1>
        <div class="score" id="endScore" style="font-size:22px;margin:10px;color:#aaa"></div>
        <table class="results-table" id="resultsTable"></table>
        <button onclick="location.reload()">Заново</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
    (function(){
        var ROLES = {
            BUILDER:{name:'Строитель',icon:'\u{1F528}',color:'#f39c12',hp:120,ammo:30,coins:150,desc:'Строит стены, башни, ловушки',passive:'Стены на 50% дешевле',abilities:['build_wall','build_tower','repair','build_trap']},
            ARCHER:{name:'Стрелок',icon:'\u{1F3F9}',color:'#e74c3c',hp:80,ammo:80,coins:80,desc:'Дальний бой, двойной урон',passive:'Дальность x1.5',abilities:['double_shot','snipe','rain_arrows','poison_arrow']},
            ENGINEER:{name:'Инженер',icon:'\u2699',color:'#3498db',hp:100,ammo:40,coins:120,desc:'Улучшает башни, щиты',passive:'Башни быстрее',abilities:['upgrade_turret','deploy_shield','repair_all','emp']},
            MEDIC:{name:'Медик',icon:'\u{1F48A}',color:'#2ecc71',hp:90,ammo:50,coins:100,desc:'Лечит, оживляет',passive:'Лечение x1.5',abilities:['heal','heal_aoe','revive','shield']},
            MAGE:{name:'Маг',icon:'\u2728',color:'#9b59b6',hp:70,ammo:60,coins:90,desc:'Магия, заморозка',passive:'Крит 25%',abilities:['fireball','ice_wall','lightning','meteor']},
            SCOUT:{name:'Разведчик',icon:'\u{1F441}',color:'#1abc9c',hp:75,ammo:45,coins:110,desc:'Быстрый, детект ловушек',passive:'Скорость x1.5',abilities:['speed_boost','trap_detect','mark_enemy','stealth']}
        };

        var WALL_TYPES={wood:{name:'Дерево',icon:'\u{1FAB5}',cost:10},stone:{name:'Камень',icon:'\u{1F9F1}',cost:20},iron:{name:'Железо',icon:'\u26D3',cost:35},magic_wall:{name:'Магия',icon:'\u2B50',cost:50},thorns:{name:'Шипы',icon:'\u{1F335}',cost:30}};
        var TOWER_TYPES={arrow:{name:'Стрелы',icon:'\u{1F3F9}',cost:25},magic:{name:'Магия',icon:'\u{1F52E}',cost:40},frost:{name:'Лёд',icon:'\u2744',cost:35},fire:{name:'Огонь',icon:'\u{1F525}',cost:50},sniper:{name:'Снайпер',icon:'\u{1F3AF}',cost:60},healer:{name:'Лечение',icon:'\u{1F49A}',cost:45}};
        var TRAP_TYPES={spike:{name:'Шипы',icon:'\u{1F4CD}',cost:15},slow:{name:'Болото',icon:'\u{1F7E4}',cost:20},explosive:{name:'Взрыв',icon:'\u{1F4A3}',cost:30},poison:{name:'Яд',icon:'\u{1F7E2}',cost:25},teleport:{name:'Телепорт',icon:'\u{1F300}',cost:40}};
        var ABILITY_INFO={build_wall:{icon:'\u{1F9F1}',name:'Стена'},build_tower:{icon:'\u{1F5FC}',name:'Башня'},repair:{icon:'\u{1F527}',name:'Ремонт'},build_trap:{icon:'\u{1F4CD}',name:'Ловушка'},double_shot:{icon:'\u{1F3F9}',name:'2 выстрела'},snipe:{icon:'\u{1F3AF}',name:'Снайпер'},rain_arrows:{icon:'\u{1F327}',name:'Дождь'},poison_arrow:{icon:'\u{1F7E2}',name:'Яд'},upgrade_turret:{icon:'\u2B06',name:'Улучшить'},deploy_shield:{icon:'\u{1F6E1}',name:'Щит'},repair_all:{icon:'\u{1F527}',name:'Починить'},emp:{icon:'\u26A1',name:'EMP'},heal:{icon:'\u{1F49A}',name:'Лечение'},heal_aoe:{icon:'\u{1F497}',name:'AOE'},revive:{icon:'\u{1F4AB}',name:'Воскрешение'},shield:{icon:'\u{1F6E1}',name:'Щит'},fireball:{icon:'\u{1F525}',name:'Огнешар'},ice_wall:{icon:'\u{1F9CA}',name:'Лед.стена'},lightning:{icon:'\u26A1',name:'Молния'},meteor:{icon:'\u2604',name:'Метеор'},speed_boost:{icon:'\u{1F4A8}',name:'Скорость'},trap_detect:{icon:'\u{1F441}',name:'Детект'},mark_enemy:{icon:'\u{1F3AF}',name:'Метка'},stealth:{icon:'\u{1F47B}',name:'Стелс'}};

        var MAP_W=1200, MAP_H=800, CENTER_X=600, CENTER_Y=400;

        var socket=null, myId=null, gs=null, selectedRole=null;
        var selectedTool='none', buildSubType='wood';
        var keys={}, mouseX=0, mouseY=0;
        var scene, renderer, camera, camTarget;
        var groundMesh, fortressMesh;
        var playerMeshes={}, mobMeshes={}, wallMeshes={}, towerMeshes={}, projectileMeshes=[];
        var particleGroup;
        var gameRunning=false, moveInterval=null, renderLoop=null;

        document.getElementById('loadingText').textContent='Загрузка Three.js...';

        setTimeout(function(){
            if(typeof THREE !== 'undefined'){
                document.getElementById('loadingScreen').classList.add('hidden');
                document.getElementById('loginScreen').classList.remove('hidden');
            } else {
                document.getElementById('loadingText').textContent='Ошибка загрузки Three.js. Обнови страницу.';
            }
        }, 3000);

        document.getElementById('nextBtn').onclick=function(){
            var name=document.getElementById('nameInput').value.trim();
            if(!name){alert('Введи имя!');return;}
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('charSelect').classList.remove('hidden');
            renderRoleGrid();
        };

        document.getElementById('joinBtn').onclick=function(){
            var name=document.getElementById('nameInput').value.trim();
            var room=document.getElementById('roomInput').value.trim()||'default';
            if(!name){alert('Введи имя!');return;}
            if(!selectedRole){alert('Выбери класс!');return;}
            document.getElementById('charSelect').classList.add('hidden');
            document.getElementById('lobbyScreen').classList.remove('hidden');
            socket=io();
            socket.on('connect',function(){
                myId=socket.id;
                socket.emit('join',{name:name,room:room,characterClass:selectedRole});
            });
            setupSocketHandlers();
        };

        document.getElementById('readyBtn').onclick=function(){
            if(!gs)return;
            var me=null;
            for(var i=0;i<gs.players.length;i++){if(gs.players[i].id===myId){me=gs.players[i];break;}}
            if(!me)return;
            socket.emit('action',{type:'ready',ready:!me.ready});
            document.getElementById('readyBtn').textContent=me.ready?'Готов':'Не готов';
        };

        document.getElementById('chatInput').onkeydown=function(e){
            e.stopPropagation();
            if(e.key==='Enter'){
                var v=document.getElementById('chatInput').value.trim();
                if(v&&socket){socket.emit('action',{type:'chat',message:v});document.getElementById('chatInput').value='';}
            }
        };

        function renderRoleGrid(){
            var keys=Object.keys(ROLES);
            var html='';
            for(var i=0;i<keys.length;i++){
                var k=keys[i], r=ROLES[k];
                html+='<div class="role-card" data-role="'+k+'" onclick="window._selectRole(\''+k+'\')">';
                html+='<div class="icon">'+r.icon+'</div>';
                html+='<div class="name" style="color:'+r.color+'">'+r.name+'</div>';
                html+='<div class="desc">'+r.desc+'</div>';
                html+='<div class="passive">* '+r.passive+'</div>';
                html+='<div class="stats">HP:'+r.hp+' AMMO:'+r.ammo+' $'+r.coins+'</div>';
                html+='</div>';
            }
            document.getElementById('roleGrid').innerHTML=html;
        }

        window._selectRole=function(key){
            selectedRole=key;
            var cards=document.querySelectorAll('.role-card');
            for(var i=0;i<cards.length;i++){
                if(cards[i].getAttribute('data-role')===key) cards[i].classList.add('selected');
                else cards[i].classList.remove('selected');
            }
        };

        function setupSocketHandlers(){
            socket.on('roomState',function(state){
                gs=state; myId=socket.id;
                updateLobby();
                if(state.phase==='build'||state.phase==='defense') startGameView();
                updateHUD(); updateBuildToolbar(); updateAbilityBar(); updatePlayerList();
            });
            socket.on('phaseChange',function(msg){
                showMessage(msg.message||'');
                if(msg.phase==='defense'){
                    document.getElementById('buildToolbar').style.display='none';
                    document.getElementById('abilityBar').style.display='flex';
                    document.getElementById('buildTimer').style.display='none';
                    document.getElementById('crosshair').style.display='block';
                }
                if(msg.phase==='build'){
                    document.getElementById('buildToolbar').style.display='flex';
                    document.getElementById('abilityBar').style.display='none';
                    document.getElementById('buildTimer').style.display='block';
                    document.getElementById('crosshair').style.display='none';
                }
            });
            socket.on('playerMove',function(msg){
                if(!gs)return;
                for(var i=0;i<gs.players.length;i++){
                    if(gs.players[i].id===msg.id){
                        gs.players[i].x=msg.x; gs.players[i].y=msg.y;
                        if(msg.direction) gs.players[i].direction=msg.direction;
                        break;
                    }
                }
            });
            socket.on('explosion',function(msg){ createExplosion(msg.x,msg.y,msg.radius,msg.color); });
            socket.on('towerShot',function(msg){ createShotLine(msg.towerId,msg.targetX,msg.targetY,msg.color); });
            socket.on('bossSpawn',function(msg){
                var bw=document.getElementById('bossWarning');
                bw.textContent=(msg.icon||'')+' '+msg.name+' ПОЯВИЛСЯ!';
                bw.style.display='block';
                setTimeout(function(){ bw.style.display='none'; },4000);
            });
            socket.on('fortressHit',function(msg){ if(gs){gs.fortressHP=msg.hp;gs.fortressMaxHP=msg.maxHp;} });
            socket.on('wallDestroyed',function(msg){ createExplosion(msg.x,msg.y,30,'#8B4513'); });
            socket.on('trapTriggered',function(msg){ createExplosion(msg.x,msg.y,20,'#9b59b6'); });
            socket.on('buildTimer',function(msg){
                var el=document.getElementById('buildTimer');
                el.style.display='block';
                el.textContent='Стройте! '+msg.timeLeft+'с';
                el.style.color=msg.timeLeft<=10?'#e74c3c':'#f1c40f';
            });
            socket.on('chat',function(msg){
                var d=document.getElementById('chatMessages');
                d.innerHTML+='<div class="chat-msg">'+msg.text+'</div>';
                d.scrollTop=d.scrollHeight;
                if(d.children.length>50) d.removeChild(d.firstChild);
            });
            socket.on('swapPosition',function(msg){
                if(!gs)return;
                var p1=null,p2=null;
                for(var i=0;i<gs.players.length;i++){
                    if(gs.players[i].id===msg.p1.id) p1=gs.players[i];
                    if(gs.players[i].id===msg.p2.id) p2=gs.players[i];
                }
                if(p1){p1.x=msg.p1.x;p1.y=msg.p1.y;}
                if(p2){p2.x=msg.p2.x;p2.y=msg.p2.y;}
            });
            socket.on('gameEnd',function(msg){
                gameRunning=false;
                if(moveInterval){clearInterval(moveInterval);moveInterval=null;}
                if(renderLoop){cancelAnimationFrame(renderLoop);renderLoop=null;}
                document.getElementById('endScreen').classList.remove('hidden');
                document.getElementById('endTitle').textContent=msg.won?'ПОБЕДА!':'ПОРАЖЕНИЕ';
                document.getElementById('endTitle').style.color=msg.won?'#2ecc71':'#e74c3c';
                document.getElementById('endScore').textContent='Счёт: '+msg.score+' | Волна: '+msg.wave+' | Убито: '+msg.totalKills;
                if(msg.results&&msg.results.length){
                    var html='<tr><th>#</th><th>Игрок</th><th>Класс</th><th>Убийства</th><th>Урон</th><th>Очки</th><th>Ур.</th></tr>';
                    for(var i=0;i<msg.results.length;i++){
                        var r=msg.results[i];
                        html+='<tr><td>'+(i+1)+'</td><td>'+r.name+'</td><td>'+r.role+'</td><td>'+r.kills+'</td><td>'+r.damage+'</td><td>'+r.score+'</td><td>'+r.level+'</td></tr>';
                    }
                    document.getElementById('resultsTable').innerHTML=html;
                }
            });
            socket.on('error_msg',function(msg){ alert(msg); location.reload(); });
            socket.on('connect_error',function(){ alert('Не удалось подключиться!'); location.reload(); });
        }

        function startGameView(){
            document.getElementById('lobbyScreen').classList.add('hidden');
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('charSelect').classList.add('hidden');
            document.getElementById('hud').style.display='flex';
            document.getElementById('playerList').style.display='block';
            document.getElementById('chatPanel').style.display='block';
            document.getElementById('controlsInfo').style.display='block';
            document.getElementById('minimap').style.display='block';
            if(!gameRunning){
                gameRunning=true;
                initThree();
                startMoveLoop();
                animate();
            }
            if(gs&&gs.phase==='build'){
                document.getElementById('buildToolbar').style.display='flex';
                document.getElementById('crosshair').style.display='none';
            }
            if(gs&&gs.phase==='defense'){
                document.getElementById('abilityBar').style.display='flex';
                document.getElementById('crosshair').style.display='block';
            }
        }

        function initThree(){
            if(renderer) return;
            var canvas=document.getElementById('gameCanvas');
            canvas.style.display='block';
            try{
                renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:false,powerPreference:'high-performance'});
            }catch(e){

                [CENTER_X,0.5,-2,MAP_W,1,4],
                [CENTER_X,0.5,MAP_H+2,MAP_W,1,4],
                [-2,0.5,CENTER_Y,4,1,MAP_H],
                [MAP_W+2,0.5,CENTER_Y,4,1,MAP_H]
            ];
            for(var i=0;i<borders.length;i++){
                var b=new THREE.Mesh(new THREE.BoxGeometry(borders[i][3],borders[i][4],borders[i][5]),borderMat);
                b.position.set(borders[i][0],borders[i][1],borders[i][2]);
                scene.add(b);
            }

            fortressMesh=new THREE.Group();
            var fb=new THREE.Mesh(new THREE.CylinderGeometry(50,52,30,12),new THREE.MeshLambertMaterial({color:0x8B4513}));
            fb.position.y=15; fb.castShadow=true; fortressMesh.add(fb);
            var fp=new THREE.Mesh(new THREE.CylinderGeometry(56,56,4,12),new THREE.MeshLambertMaterial({color:0x654321}));
            fp.position.y=32; fortressMesh.add(fp);
            for(var a=0;a<4;a++){
                var angle=a*Math.PI/2;
                var tx=CENTER_X+Math.cos(angle)*48;
                var tz=CENTER_Y+Math.sin(angle)*48;
                var tt=new THREE.Mesh(new THREE.CylinderGeometry(6,8,20,6),new THREE.MeshLambertMaterial({color:0x654321}));

                fortressMesh.add(tt);
                var tc=new THREE.Mesh(new THREE.ConeGeometry(8,8,6),new THREE.MeshLambertMaterial({color:0xe94560}));
                tc.position.set(tx-CENTER_X,25,tz-CENTER_Y);
                fortressMesh.add(tc);
            }
            fortressMesh.position.set(CENTER_X,0,CENTER_Y);
            scene.add(fortressMesh);

            particleGroup=new THREE.Group();
            scene.add(particleGroup);

            createEnvironment();
            window.addEventListener('resize',function(){
                if(!renderer)return;
                camera.aspect=window.innerWidth/window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth,window.innerHeight);
            });

        function createEnvironment(){
            for(var i=0;i<35;i++){
                var x=Math.random()*MAP_W;
                var z=Math.random()*MAP_H;
                if(Math.hypot(x-CENTER_X,z-CENTER_Y)<120) continue;
                var h=12+Math.random()*18;
                var tree=new THREE.Mesh(new THREE.ConeGeometry(7+Math.random()*7,h,5),new THREE.MeshLambertMaterial({color:0x228B22}));
                tree.position.set(x,h/2,z); tree.castShadow=true;
                scene.add(tree);
                var trunk=new THREE.Mesh(new THREE.CylinderGeometry(1,1.5,5,4),new THREE.MeshLambertMaterial({color:0x8B4513}));
                trunk.position.set(x,2.5,z);
                scene.add(trunk);
            }
            for(var i=0;i<25;i++){
                var x=Math.random()*MAP_W;
                var z=Math.random()*MAP_H;
                if(Math.hypot(x-CENTER_X,z-CENTER_Y)<80) continue;
                var rock=new THREE.Mesh(new THREE.DodecahedronGeometry(2+Math.random()*5,0),new THREE.MeshLambertMaterial({color:0x808080}));
                rock.position.set(x,1.5+Math.random()*2,z);
                rock.rotation.set(Math.random(),Math.random(),Math.random());
                rock.castShadow=true;
                scene.add(rock);
            }
            for(var i=0;i<15;i++){
                var x=Math.random()*MAP_W;
                var z=Math.random()*MAP_H;
                if(Math.hypot(x-CENTER_X,z-CENTER_Y)<100) continue;
                var bush=new THREE.Mesh(new THREE.SphereGeometry(3+Math.random()*3,5,4),new THREE.MeshLambertMaterial({color:0x1B5E20}));
                bush.position.set(x,2,z);
                bush.castShadow=true;
                scene.add(bush);
            }
        }

        function createExplosion(x,z,radius,color){
            if(!particleGroup||!THREE)return;
            var c=new THREE.Color(color);
            for(var i=0;i<12;i++){
                var geo=new THREE.SphereGeometry(0.4+Math.random()*1.2,4,3);
                var mat=new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:1});
                var mesh=new THREE.Mesh(geo,mat);
                mesh.position.set(x,3+Math.random()*8,z);
                var angle=Math.random()*Math.PI*2;
                var speed=0.8+Math.random()*2.5;
                mesh.userData={vx:Math.cos(angle)*speed,vy:1.5+Math.random()*3,vz:Math.sin(angle)*speed,life:25+Math.random()*20,maxLife:45};
                particleGroup.add(mesh);
            }
        }

        function createShotLine(towerId,tx,tz,color){
            if(!scene||!gs||!THREE)return;
            var tower=null;
            if(gs.towers){
                for(var i=0;i<gs.towers.length;i++){
                    if(gs.towers[i].id===towerId){tower=gs.towers[i];break;}
                }
            }
            if(!tower)return;
            var y1=15, y2=5;
            var tz2=tower.z||tower.y||0;
            var points=[new THREE.Vector3(tower.x,y1,tz2),new THREE.Vector3(tx,y2,tz)];
            var geo=new THREE.BufferGeometry().setFromPoints(points);
            var mat=new THREE.LineBasicMaterial({color:new THREE.Color(color),transparent:true,opacity:1});
            var line=new THREE.Line(geo,mat);
            line.userData={life:10};
            scene.add(line);
        }

        function animate(){
            if(!gameRunning)return;
            renderLoop=requestAnimationFrame(animate);
            updateCamera();
            updateScene();
            updateParticles();
            if(renderer&&scene&&camera) renderer.render(scene,camera);
        }

        function updateCamera(){
            if(!camera)return;
            var me=null;
            if(gs&&gs.players){
                for(var i=0;i<gs.players.length;i++){
                    if(gs.players[i].id===myId){me=gs.players[i];break;}
                }
            }
            if(me){
                camTarget.set(me.x,0,me.z||me.y);
            }
            camera.lookAt(camTarget);
        }

        function updateScene(){
            if(!gs)return;
            var p,i,s,mesh,angle;

            if(gs.players){
                for(i=0;i<gs.players.length;i++){
                    p=gs.players[i];
                    mesh=playerMeshes[p.id];
                    if(!mesh){
                        mesh=new THREE.Group();
                        var r=ROLES[p.roleKey]||{color:'#fff'};
                        s=new THREE.Mesh(new THREE.CapsuleGeometry(4,8,3,6),new THREE.MeshLambertMaterial({color:new THREE.Color(r.color||'#fff')}));
                        s.position.y=8; s.castShadow=true; mesh.add(s);
                        var head=new THREE.Mesh(new THREE.SphereGeometry(3.5,6,6),new THREE.MeshLambertMaterial({color:0xffdbac}));
                        head.position.y=18; head.castShadow=true; mesh.add(head);

                        var nameC=document.createElement('canvas');
                        nameC.width=128; nameC.height=24;
                        var nctx=nameC.getContext('2d');
                        nctx.fillStyle='rgba(0,0,0,0.6)';
                        nctx.fillRect(0,0,128,24);
                        nctx.fillStyle='#fff';
                        nctx.font='bold 12px Arial';
                        nctx.textAlign='center';
                        nctx.fillText(p.name,64,16);
                        var nTex=new THREE.CanvasTexture(nameC);
                        var nSprite=new THREE.Sprite(new THREE.SpriteMaterial({map:nTex,transparent:true}));
                        nSprite.position.y=28; nSprite.scale.set(28,5,1);
                        mesh.add(nSprite);

                        if(p.id===myId){
                            var ring=new THREE.Mesh(new THREE.RingGeometry(6,8,12),new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide,transparent:true,opacity:0.4}));
                            ring.rotation.x=-Math.PI/2; ring.position.y=0.3; mesh.add(ring);
                        }
                        scene.add(mesh);
                        playerMeshes[p.id]=mesh;
                    }
                    mesh.position.set(p.x,0,p.z||p.y);
                    mesh.visible=!p.isDead;
                    if(p.direction){
                        angle=Math.atan2(p.direction.x||0,p.direction.y||0);
                        mesh.rotation.y=angle;
                    }
                }
            }

            if(gs.mobs){
                for(i=0;i<gs.mobs.length;i++){
                    var mob=gs.mobs[i];
                    mesh=mobMeshes[mob.id];
                    if(!mesh){
                        mesh=new THREE.Group();
                        s=mob.size/2||5;
                        var body=new THREE.Mesh(new THREE.SphereGeometry(s,6,5),new THREE.MeshLambertMaterial({color:new THREE.Color(mob.color||'#8B4513')}));
                        body.position.y=s+1; body.castShadow=true; mesh.add(body);
                        if(mob.isBoss){
                            var crown=new THREE.Mesh(new THREE.ConeGeometry(s*0.4,s*0.8,4),new THREE.MeshLambertMaterial({color:0xffd700}));
                            crown.position.y=s*2+3; mesh.add(crown);
                            body.scale.multiplyScalar(1.5);
                        }
                        var hpBg=new THREE.Mesh(new THREE.PlaneGeometry(s*2+2,2),new THREE.MeshBasicMaterial({color:0x333333,side:THREE.DoubleSide}));
                        hpBg.position.y=s*2+6; mesh.add(hpBg);
                        var hpFill=new THREE.Mesh(new THREE.PlaneGeometry(s*2,1.2),new THREE.MeshBasicMaterial({color:0xff0000,side:THREE.DoubleSide}));
                        hpFill.position.y=s*2+6; hpFill.position.z=0.1; mesh.add(hpFill);
                        scene.add(mesh);
                        mobMeshes[mob.id]=mesh;
                    }
                    mesh.position.set(mob.x,0,mob.z||mob.y);
                    var hpPct=Math.max(0,mob.hp/mob.maxHp);
                    var hpBar=mesh.children.length>=(mob.isBoss?4:3)?mesh.children[mesh.children.length-1]:null;
                    if(hpBar){hpBar.scale.x=hpPct; hpBar.position.x=-(1-hpPct)*s;}
                }
            }

            if(gs.walls){
                for(i=0;i<gs.walls.length;i++){
                    var w=gs.walls[i];
                    mesh=wallMeshes[w.id];
                    if(!mesh){
                        s=w.size/2||12;
                        mesh=new THREE.Mesh(new THREE.BoxGeometry(s*2,s*2,s*2),new THREE.MeshLambertMaterial({color:new THREE.Color(w.color||'#8B4513'),transparent:true}));
                        mesh.position.set(w.x,s,w.z||w.y); mesh.castShadow=true; mesh.receiveShadow=true;
                        scene.add(mesh);
                        wallMeshes[w.id]=mesh;
                    }
                    var whp=Math.max(0,Math.min(1,w.hp/w.maxHp));
                    mesh.material.color.set(new THREE.Color(w.color||'#8B4513'));
                    mesh.material.opacity=0.3+whp*0.7;
                }
            }

            if(gs.towers){
                for(i=0;i<gs.towers.length;i++){
                    var t=gs.towers[i];
                    mesh=towerMeshes[t.id];
                    if(!mesh){
                        mesh=new THREE.Group();
                        s=t.size/2||6;
                        var base=new THREE.Mesh(new THREE.CylinderGeometry(s-1,s+1,14,6),new THREE.MeshLambertMaterial({color:new THREE.Color(t.color||'#555')}));
                        base.position.y=7; base.castShadow=true; mesh.add(base);
                        var top=new THREE.Mesh(new THREE.OctahedronGeometry(4,0),new THREE.MeshBasicMaterial({color:new THREE.Color(t.color||'#e94560')}));
                        top.position.y=18; mesh.add(top);
                        mesh.position.set(t.x,0,t.z||t.y);
                        scene.add(mesh);
                        towerMeshes[t.id]=mesh;
                    }
                }
            }

            for(i=projectileMeshes.length-1;i>=0;i--){
                scene.remove(projectileMeshes[i]);
                if(projectileMeshes[i].geometry)projectileMeshes[i].geometry.dispose();
                if(projectileMeshes[i].material)projectileMeshes[i].material.dispose();
            }
            projectileMeshes=[];

            if(gs.projectiles){
                for(i=0;i<gs.projectiles.length;i++){
                    var pp=gs.projectiles[i];
                    var geo=new THREE.SphereGeometry(pp.size/2||1.5,4,3);
                    var mat=new THREE.MeshBasicMaterial({color:new THREE.Color(pp.color||'#ffffff')});
                    mesh=new THREE.Mesh(geo,mat);
                    mesh.position.set(pp.x,4,pp.z||pp.y);
                    scene.add(mesh);
                    projectileMeshes.push(mesh);
                }
            }
        }

        function updateParticles(){
            if(!particleGroup)return;
            for(var i=particleGroup.children.length-1;i>=0;i--){
                var p=particleGroup.children[i];
                if(p.userData.life!==undefined){
                    p.position.x+=p.userData.vx||0;
                    p.position.y+=p.userData.vy||0;
                    p.position.z+=p.userData.vz||0;
                    p.userData.vy=(p.userData.vy||0)-0.08;
                    p.userData.life--;
                    if(p.material)p.material.opacity=Math.max(0,p.userData.life/p.userData.maxLife);
                    if(p.userData.life<=0){
                        particleGroup.remove(p);
                        if(p.geometry)p.geometry.dispose();
                        if(p.material)p.material.dispose();
                    }
                }
            }
            if(!scene)return;
            for(var i=scene.children.length-1;i>=0;i--){
                var c=scene.children[i];
                if(c.isLine&&c.userData&&c.userData.life!==undefined){
                    c.userData.life--;
                    if(c.material)c.material.opacity=Math.max(0,c.userData.life/10);
                    if(c.userData.life<=0){
                        scene.remove(c);
                        if(c.geometry)c.geometry.dispose();
                        if(c.material)c.material.dispose();
                    }
                }
            }
        }

        function startMoveLoop(){
            if(moveInterval)clearInterval(moveInterval);
            moveInterval=setInterval(function(){
                if(!gs||!gs.players)return;
                var me=null;
                for(var i=0;i<gs.players.length;i++){
                    if(gs.players[i].id===myId){me=gs.players[i];break;}
                }
                if(!me||me.isDead)return;
                if(gs.phase!=='defense'&&gs.phase!=='build')return;
                var dx=0,dy=0;
                if(keys['w']||keys['ц'])dy=-1;
                if(keys['s']||keys['ы'])dy=1;
                if(keys['a']||keys['ф'])dx=-1;
                if(keys['d']||keys['в'])dx=1;
                if((dx||dy)&&socket){
                    var len=Math.sqrt(dx*dx+dy*dy);
                    dx/=len; dy/=len;
                    socket.emit('action',{type:'move',dx:dx,dy:dy,lookingAt:{x:me.x+dx*50,y:(me.z||me.y)+dy*50}});
                }
            },50);
        }

                '<div>Mobs: '+gs.mobCount+' | Killed: '+gs.waveMobsKilled+'/'+gs.waveMobsTotal+'</div>'+
                '<div>Score: '+gs.score+(gs.comboMultiplier>1?' | Combo x'+gs.comboMultiplier.toFixed(1):'')+'</div>';

        function updateBuildToolbar(){

                if(gs.players[i].id===myId){me=gs.players[i];break;}

        function updateAbilityBar(){
            if(!gs)return;
            var me=null;
            for(var i=0;i<gs.players.length;i++){
                if(gs.players[i].id===myId){me=gs.players[i];break;}
            }
            if(!me)return;
            var abs=ROLES[me.roleKey]?ROLES[me.roleKey].abilities:[];
            var html='';
            for(var i=0;i<abs.length;i++){
                var ab=abs[i];
                var info=ABILITY_INFO[ab]||{icon:'?',name:ab};
                var cdLeft=Math.max(0,me.abilityCooldowns?me.abilityCooldowns[ab]||0:0);
                html+='<div class="ability-btn'+(cdLeft>0?' on-cd':'')+'" onclick="window._useAbility(\''+ab+'\')">';
                html+='<span class="a-key">'+(i+1)+'</span>';
                html+='<span class="a-icon">'+info.icon+'</span>';
                html+='<span style="font-size:8px">'+info.name+'</span>';
                if(cdLeft>0) html+='<span class="a-cd">'+Math.ceil(cdLeft/1000)+'s</span>';
                html+='</div>';
            }
            document.getElementById('abilityBar').innerHTML=html;

        window._selectBuildTool=function(tool,sub){selectedTool=tool;buildSubType=sub;updateBuildToolbar();};
        window._endBuild=function(){if(socket)socket.emit('action',{type:'endBuild'});};
        window._useAbility=function(name){
            if(!gs||!socket)return;
            var me=null;
            for(var i=0;i<gs.players.length;i++){
                if(gs.players[i].id===myId){me=gs.players[i];break;}
            }
            if(!me)return;
            var tx=CENTER_X, ty=CENTER_Y;
            if(camera&&groundMesh){
                var mouse2=new THREE.Vector2((mouseX/window.innerWidth)*2-1,-(mouseY/window.innerHeight)*2+1);
                var raycaster=new THREE.Raycaster();
                raycaster.setFromCamera(mouse2,camera);
                var intersects=raycaster.intersectObject(groundMesh);
                if(intersects.length>0){tx=intersects[0].point.x;ty=intersects[0].point.z;}
            }
            socket.emit('action',{type:'useAbility',ability:name,targetX:tx,targetY:ty});
        };

        function renderMinimap(){
            var mc=document.getElementById('minimap');
            if(mc.style.display==='none'||!gs)return;
            var mctx=mc.getContext('2d');
            mctx.fillStyle='#1a3a1a'; mctx.fillRect(0,0,150,112);
            var sx=150/MAP_W, sy=112/MAP_H;
            mctx.fillStyle='#654321';
            mctx.fillRect(CENTER_X*sx-3,CENTER_Y*sy-3,6,6);
            if(gs.walls){
                mctx.fillStyle='#aa8844';
                for(var i=0;i<gs.walls.length;i++){
                    var w=gs.walls[i];
                    mctx.fillRect(w.x*sx-1,(w.z||w.y)*sy-1,2,2);
                }
            }
            if(gs.towers){
                for(var i=0;i<gs.towers.length;i++){
                    var t=gs.towers[i];
                    mctx.fillStyle=t.color||'#e94560';
                    mctx.fillRect(t.x*sx-2,(t.z||t.y)*sy-2,4,4);
                }
            }
            if(gs.players){
                for(var i=0;i<gs.players.length;i++){
                    var p=gs.players[i];
                    mctx.fillStyle=ROLES[p.roleKey]?ROLES[p.roleKey].color:'#fff';
                    mctx.beginPath();
                    mctx.arc(p.x*sx,(p.z||p.y)*sy,3,0,Math.PI*2);
                    mctx.fill();
                }
            }
            if(gs.mobs){
                for(var i=0;i<gs.mobs.length;i++){
                    var m=gs.mobs[i];
                    mctx.fillStyle=m.isBoss?'#ff0000':'#ff6666';
                    mctx.fillRect(m.x*sx-1,(m.z||m.y)*sy-1,m.isBoss?4:2,m.isBoss?4:2);
                }
            }
        }

        document.addEventListener('keydown',function(e){
            keys[e.key.toLowerCase()]=true;
            if(e.key==='t'||e.key==='T'||e.key==='\u0442'||e.key==='\u0422'){
                var ci=document.getElementById('chatInput');
                if(document.activeElement!==ci){e.preventDefault();ci.focus();}
            }
            if(gs&&gs.phase==='defense'){
                var me=null;
                for(var i=0;i<gs.players.length;i++){
                    if(gs.players[i].id===myId){me=gs.players[i];break;}
                }
                if(me&&!me.isDead){
                    var abs=ROLES[me.roleKey]?ROLES[me.roleKey].abilities:[];
                    var n=parseInt(e.key);
                    if(n>=1&&n<=abs.length) window._useAbility(abs[n-1]);
                }
            }
            if(e.key==='Escape'){
                document.getElementById('chatInput').blur();
                selectedTool='none'; updateBuildToolbar();
            }
        });

        document.addEventListener('keyup',function(e){ keys[e.key.toLowerCase()]=false; });

        document.getElementById('gameCanvas').addEventListener('click',function(e){
            if(!gs||!camera||!groundMesh)return;
            mouseX=e.clientX; mouseY=e.clientY;
            var mouse2=new THREE.Vector2((e.clientX/window.innerWidth)*2-1,-(e.clientY/window.innerHeight)*2+1);
            var raycaster=new THREE.Raycaster();
            raycaster.setFromCamera(mouse2,camera);
            var intersects=raycaster.intersectObject(groundMesh);
            if(!intersects.length)return;
            var wp=intersects[0].point;
            if(gs.phase==='build'){
                if(selectedTool==='wall'&&socket) socket.emit('action',{type:'placeWall',x:wp.x,y:wp.z,wallType:buildSubType});
                else if(selectedTool==='tower'&&socket) socket.emit('action',{type:'placeTower',x:wp.x,y:wp.z,towerType:buildSubType});
                else if(selectedTool==='trap'&&socket) socket.emit('action',{type:'placeTrap',x:wp.x,y:wp.z,trapType:buildSubType});
            }
            if(gs.phase==='defense'){
                var me=null;
                for(var i=0;i<gs.players.length;i++){
                    if(gs.players[i].id===myId){me=gs.players[i];break;}
                }
                if(me&&!me.isDead&&socket) socket.emit('action',{type:'shoot',targetX:wp.x,targetY:wp.z});
            }
        });

        document.getElementById('gameCanvas').addEventListener('mousemove',function(e){ mouseX=e.clientX; mouseY=e.clientY; });

        var lastWheel=0;
        document.getElementById('gameCanvas').addEventListener('wheel',function(e){
            e.preventDefault();
            var now=Date.now();
            if(now-lastWheel<50)return;
            lastWheel=now;
            if(camera){
                var dir=new THREE.Vector3();
                camera.getWorldDirection(dir);
                var dist=camera.position.distanceTo(camTarget);
                var newDist=dist+e.deltaY*0.3;
                newDist=Math.max(80,Math.min(600,newDist));
                camera.position.copy(camTarget).addScaledVector(dir,-newDist);
            }
        },{passive:false});

        setInterval(function(){updateHUD();updatePlayerList();updateAbilityBar();renderMinimap();},500);

    })();
    </script>
</body>
</html>
